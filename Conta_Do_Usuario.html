<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conta do Usuário</title>




    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #edf2fd;
    font-family: Arial, Helvetica, sans-serif;
    color: #1f2691;
}

/* Barra superior */
.navbar {
    background-color: #c4ee94;
    width: 100%;
    min-height: 150px;
    border-bottom: 5px solid #1f2691;
    display: flex;
    align-items: center;
    padding: 20px 5%;
    gap: 40px;
}

.logo {
    width: 15%;
    height: auto;
}

h1 {
    color: #1f2691;
    font-size: 40px;
}

/* Título da seção */
.conta {
    background-color: #1f2691;
    border-radius: 15px;
    width: 90%;
    margin: 30px auto 20px;
    padding: 18px;
    text-align: center;
}

.info {
    color: #ffffff;
    font-size: 32px;
}

/* Área principal do formulário */
.dados {
    background-color: #ffffff;
    border: 3px solid #1f2691;
    border-radius: 20px;
    width: 90%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 35px;
    display: flex;
    flex-wrap: wrap;
    gap: 35px;
    box-shadow: 0 5px 15px rgba(31, 38, 145, 0.15);
}

/* Colunas */
.Informações,
.dados2 {
    flex: 1;
    min-width: 280px;
    height: auto;
    margin: 0;
    text-align: left;
}

.Informações h2,
.dados2 h2 {
    color: #1f2691;
    font-size: 24px;
    margin-bottom: 25px;
    border-bottom: 3px solid #abff4b;
    padding-bottom: 10px;
}

/* Rótulos dos campos */
label {
    display: block;
    color: #1f2691;
    font-weight: bold;
    margin: 15px 0 7px;
}

/* Campos de entrada */
input {
    width: 100%;
    padding: 13px;
    border: 2px solid #d5dcf5;
    border-radius: 10px;
    background-color: #f4f7ff;
    font-size: 16px;
    outline: none;
    transition: 0.3s;
}

input:focus {
    border-color: #1f2691;
    box-shadow: 0 0 0 3px rgba(171, 255, 75, 0.6);
    background-color: #ffffff;
}

/* Botão de salvar */
.botao-salvar {
    width: 100%;
    background-color: #1f2691;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    padding: 15px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.botao-salvar:hover {
    background-color: #abff4b;
    color: #1f2691;
    transform: translateY(-2px);
}

/* Área dos botões da conta */
.acoes-conta {
    width: 90%;
    max-width: 1100px;
    margin: 25px auto 40px;
    display: flex;
    justify-content: center;
    gap: 20px;
}

/* Botões de ação */
.botao-senha,
.botao-excluir,
.btn-logout {
    text-decoration: none;
    text-align: center;
    padding: 14px 25px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

/* Trocar senha */
.botao-senha {
    background-color: #1f2691;
    color: #ffffff;
    border: 2px solid #1f2691;
}

.botao-senha:hover {
    background-color: #3038c7;
    transform: translateY(-2px);
}

/* Excluir conta */
.botao-excluir {
    background-color: #ffffff;
    color: #c62828;
    border: 2px solid #c62828;
}

.botao-excluir:hover {
    background-color: #c62828;
    color: #ffffff;
    transform: translateY(-2px);
}

.btn-logout{
   background-color: #ffffff;
    color: blue;
    border: 2px solid greenyellow; 
}

.btn-logout:hover{
    background-color: greenyellow;
    color: #ffffff;
    transform: translateY(-2px); 
}

/* Ajustes para telas pequenas */
@media (max-width: 700px) {

    .navbar {
        flex-direction: column;
        gap: 15px;
    }

    .area-titulo {
        width: 100%;
        padding: 15px;
    }

    h1 {
        font-size: 28px;
    }

    .dados {
        padding: 20px;
    }

    .acoes-conta {
        flex-direction: column;
    }

    .botao-senha,
    .botao-excluir {
        width: 100%;
    }
}
    </style>
</head>

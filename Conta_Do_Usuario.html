<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conta do Usuário - FarmaSync</title>
    <script src="preferencias-globais.js" defer></script>
    <!-- Ícones e Fontes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
 <link rel="icon" href="img/logo.png">
    <style>
        /* ==========================================================================
           RESET & CONFIGURAÇÕES GLOBAIS
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #1f2d2b;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ==========================================================================
           BARRA DE NAVEGAÇÃO (NAVBAR)
           ========================================================================== */
        .navbar {
            background-color: #ffffff;
            width: 100%;
            min-height: 90px;
            border-bottom: 1px solid #e2e8f0;
            box-shadow: 0 2px 12px rgba(0, 60, 55, 0.06);
            display: flex;
            align-items: center;
            padding: 15px 40px;
            gap: 40px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border-radius: 50%;
            background: white;
            padding: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        /* ==========================================================================
           CABEÇALHO DA SEÇÃO
           ========================================================================== */
        .conta {
            background-color: #006C63;
            border-radius: 14px;
            width: 90%;
            max-width: 1100px;
            margin: 30px auto 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0, 108, 99, 0.2);
        }

        .info {
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
        }

        /* ==========================================================================
           FORMULÁRIO DE DADOS
           ========================================================================== */
        .dados {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            width: 90%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .Informações,
        .dados2 {
            flex: 1;
            min-width: 280px;
            text-align: left;
        }

        .Informações h2,
        .dados2 h2 {
            color: #0f172a;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 25px;
            border-bottom: 3px solid #006C63;
            padding-bottom: 10px;
            transition: color 0.3s ease;
        }

        /* Rótulos e Inputs */
        label {
            display: block;
            color: #475569;
            font-weight: 600;
            font-size: 14px;
            margin: 15px 0 6px;
            transition: color 0.3s ease;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background-color: #f8fafc;
            font-size: 15px;
            color: #1e293b;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #006C63;
            box-shadow: 0 0 0 3px rgba(0, 108, 99, 0.12);
            background-color: #ffffff;
        }

        /* Botão de Salvar */
        .botao-salvar {
            width: 100%;
            background-color: #006C63;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 30px;
            box-shadow: 0 4px 12px rgba(0, 108, 99, 0.2);
        }

        .botao-salvar:hover {
            background-color: #00564f;
            transform: translateY(-2px);
        }

        .botao-salvar:active {
            transform: scale(0.98);
        }

        /* ==========================================================================
           AÇÕES DA CONTA (BOTÕES INFERIORES)
           ========================================================================== */
        .acoes-conta {
            width: 90%;
            max-width: 1100px;
            margin: 25px auto 40px;
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .botao-senha,
        .botao-excluir,
        .btn-logout {
            text-decoration: none;
            text-align: center;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .botao-senha {
            background-color: #006C63;
            color: #ffffff;
            border: 1px solid #006C63;
        }

        .botao-senha:hover {
            background-color: #00564f;
            transform: translateY(-2px);
        }

        .botao-excluir {
            background-color: #ffffff;
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .botao-excluir:hover {
            background-color: #fee2e2;
            transform: translateY(-2px);
        }

        .btn-logout {
            background-color: #ffffff;
            color: #475569;
            border: 1px solid #cbd5e1;
        }

        .btn-logout:hover {
            background-color: #f1f5f9;
            color: #0f172a;
            transform: translateY(-2px);
        }

        /* ==========================================================================
           MODAL & OVERLAY
           ========================================================================== */
        #sobreposicao-tela {
            display: none;
        }

        @keyframes entradaSuaveModal {
            0% { opacity: 0; transform: scale(0.85) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        #cartao-informativo {
            background: #fff;
            padding: 35px 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: entradaSuaveModal 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ==========================================================================
           SUPORTE AO TEMA ESCURO (DARK MODE)
           ========================================================================== */
        body.tema-escuro {
            background-color: #0f172a !important;
            color: #f8fafc !important;
        }

        body.tema-escuro .navbar {
            background-color: #1e293b !important;
            border-bottom-color: #334155 !important;
        }

        body.tema-escuro .dados {
            background-color: #1e293b !important;
            border-color: #334155 !important;
        }

        body.tema-escuro .Informações h2,
        body.tema-escuro .dados2 h2 {
            color: #f8fafc !important;
            border-bottom-color: #006C63 !important;
        }

        body.tema-escuro label {
            color: #94a3b8 !important;
        }

        body.tema-escuro input {
            background-color: #0f172a !important;
            border-color: #334155 !important;
            color: #f8fafc !important;
        }

        body.tema-escuro input:focus {
            border-color: #006C63 !important;
            background-color: #1e293b !important;
        }

        body.tema-escuro .botao-excluir {
            background-color: #1e293b !important;
            border-color: #ef4444 !important;
            color: #ef4444 !important;
        }

        body.tema-escuro .botao-excluir:hover {
            background-color: #7f1d1d !important;
            color: #ffffff !important;
        }

        body.tema-escuro .btn-logout {
            background-color: #1e293b !important;
            border-color: #334155 !important;
            color: #cbd5e1 !important;
        }

        body.tema-escuro .btn-logout:hover {
            background-color: #334155 !important;
            color: #ffffff !important;
        }

        /* ==========================================================================
           RESPONSIVIDADE
           ========================================================================== */
        @media (max-width: 700px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
                text-align: center;
            }

            .dados {
                padding: 20px;
            }

            .acoes-conta {
                flex-direction: column;
            }

            .botao-senha,
            .botao-excluir,
            .btn-logout {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Overlay & Modal de Alerta/Confirmação -->
    <div id="sobreposicao-tela">
        <div id="cartao-informativo">
            <div id="sucesso">
                <div id="error"></div>
            </div>
        </div>
    </div>

    <!-- Barra de Navegação -->
    <div class="navbar">
        <img class="logo" src="img/Logo.png" alt="Logo FarmaSync">
    </div>

    <!-- Cabeçalho de Informações -->
    <div class="conta">
        <h1 class="info">Minha Conta</h1>
    </div>

    <!-- Formulário Principal de Atualização -->
    <form class="dados" method="POST" action="" id="update-form">

        <div class="Informações">
            <h2>Informações Pessoais</h2>

            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nomeUsuario">

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf">

            <label for="genero">Gênero:</label>
            <input list="lista-genero" name="genero" id="genero">
            <datalist id="lista-genero">
                <option value="Masculino">
                <option value="Feminino">
                <option value="Não Binário">
                <option value="Prefiro não dizer">
            </datalist>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone">

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="emailUsuario">
        </div>

        <div class="dados2">
            <h2>Endereço</h2>

            <label for="endereco">Logradouro:</label>
            <input type="text" id="endereco" name="logradouro">
     
            <label for="numero">Número:</label>
            <input type="text" id="numero">
         
            <label for="complemento">Complemento:</label>
            <input type="text" id="complemento">

            <label for="bairro">Bairro:</label>
            <input type="text" id="bairro" name="bairro">

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade">
         
            <label for="estado">Estado:</label>
            <input list="lista-Estado" name="estado" id="estado">
            <datalist id="lista-Estado">
                <option value="AC"><option value="AL"><option value="AP"><option value="AM"><option value="BA"><option value="CE"><option value="DF"><option value="ES"><option value="GO"><option value="MA"><option value="MT"><option value="MS"><option value="MG"><option value="PA"><option value="PB"><option value="PR"><option value="PE"><option value="PI"><option value="RJ"><option value="RN"><option value="RS"><option value="RO"><option value="RR"><option value="SC"><option value="SP"><option value="SE"><option value="TO">
            </datalist>

            <label for="cep">CEP:</label>
            <input id="cep" type="text" name="cep">

            <input type="hidden" id="senha" name="senhaUsuario">
        </div>

        <button type="button" onclick="abrirModalConfirmacao(event)" class="botao-salvar">
            Atualizar Informações
        </button>

    </form>

    <!-- Ações Inferiores da Conta -->
    <div class="acoes-conta">
        <a href="trocar_senha.html" class="botao-senha">
            <i class="fa-solid fa-lock" style="margin-right: 8px;"></i> Trocar senha
        </a>

        <a href="Exclusão_Da_Conta.html" class="botao-excluir">
            <i class="fa-solid fa-trash" style="margin-right: 8px;"></i> Excluir conta
        </a>

        <button onclick="logout()" class="btn-logout">
            <i class="fa-solid fa-right-from-bracket" style="margin-right: 8px;"></i> Sair
        </button>
    </div>

    <!-- Modal Dinâmico -->
    <div id="modal-atualizar">
        <div id="caixa-alerta">
            <div id="confirm"></div> 
        </div>
    </div>

    <!-- Script Externo -->
    <script src="usuarioget.js"></script>
</body>
</html>

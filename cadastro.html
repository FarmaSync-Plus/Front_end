        <!DOCTYPE html>
        <html lang="pt-br">
        <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="css/cadastro.css" rel="stylesheet">
        <link rel="icon" href="img/logo.png"> 
        <title>Cadastro - FarmaSync</title>
    
    </head>
    <body>


<header class="cadastre-se">
     <img src="img/logo.png" id="logo2" alt="Logo do site">
    <h1>Cadastre-se</h1>
     <a href="ajuda.html" class="link-ajuda">Ajuda?</a>
</header>
 
<div class="boas-vindas">
<p class="boas-vindas">Bem-vindo(a) ao Farmasync! Por favor, preencha os campos abaixo para criar sua conta.</p>
</div>

<form class="formulario-de-cadastro">
<div class="conteudo-duplo">

    <div class = "coluna">
        <h3> Informações pessoais</h3>
        <div class="grupo">
                <input type="text" placeholder="Nome completo:">
                <input type="text" placeholder="CPF:">
                <input type="text" placeholder="Data de Nascimento:">
                <input type="text" placeholder="Gênero:">
                <input type="tel" placeholder="Tel/Contato:">
                <input type="email" placeholder="E-mail:">
                <input type="password" placeholder="Senha:">
                <input type="password" placeholder="Confirmar Senha:">
</div>
</div>
            
<div class = "coluna">
        <h3> Informações de endereço</h3>  
        <div class="grupo">
                <input type="text" placeholder="Logradouro:">
                <input type="text" placeholder="Número:">
                <input type="text" placeholder="Complemento:">
                <input type="text" placeholder="Bairro:">
                <input type="text" placeholder="Cidade:">
                <input type="text" placeholder="Estado:">
                <input type="text" placeholder="CEP:">
                
        </div>
        </div>
        </div>

        <div class="rodape-form">
                <label class="termos">
                    <input type="checkbox">
                    Li e aceito os Termos de uso dos dados, e as politicas de Privacidade
                </label>

                <button type="submit" class="btn-cadastrar">Cadastrar.</button>
            </div>

        </form>
  

</body>
</html>

        <!DOCTYPE html>
        <html lang="pt-br">
        <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="css/cadastro.css" rel="stylesheet">
        <link rel="icon" href="img/logo.png"> 
        <title>Cadastro - FarmaSync</title>
    
    </head>
    <body>


 <div id="sobreposicao-tela">

<div id="cartao-informativo">

<div id="result"></div>
</div>
</div>

<header class="cadastre-se">
     <img src="img/logo.png" id="logo2" alt="Logo do site">
    <h1>Cadastre-se</h1>
     <a href="ajuda.html" class="link-ajuda">Ajuda?</a>
</header>
 
<div class="boas-vindas">
<p class="boas-vindas">Bem-vindo(a) ao Farmasync! Por favor, preencha os campos abaixo para criar sua conta.</p>
</div>

<form class="formulario-de-cadastro" id="cadastro-form" >

<div class="conteudo-duplo">

    <div class = "coluna">
        <h3> Informações pessoais</h3>
        <div class="grupo">
                <input type="text" required name="nomeUsuario" id="nome" placeholder="Nome completo:">

                <input type="text" name="cpf" id="cpf" required placeholder="CPF:">

                <input type="date"  name="dataDeNascimento" placeholder="Data de Nascimento:">

                <input list="genero" placeholder="Genero" name="genero"><br>
<datalist id="genero" >
<option value="Masculino">
<option value="Feminino">
<option value ="Não Binário">
<option value="Prefiro não dizer">
 </datalist>




                <input type="tel" required name="telefone" placeholder="Tel/Contato:" >



                <input type="email" required name="emailUsuario" id="email"
                placeholder="E-mail:">


                <input type="text" id="senha" minlength="8"  required
                placeholder="Senha:">


                <input type="text" id="Confirmar-senha" name="senhaUsuario" required
                placeholder="Confirmar Senha:">
 
                <span id="aviso"></span>
            </div>
</div>
            
<div class = "coluna">
        <h3> Informações de endereço</h3>  
        <div class="grupo">
                <input type="text" name="logradouro"
                placeholder="Logradouro:">

                <input type="text" placeholder="Número:">

                <input type="text" placeholder="Complemento:">

                <input type="text" name="bairro"
                placeholder="Bairro:">

                <input type="text" name="cidade"
                placeholder="Cidade:">

                 <input list="estado" placeholder="Estado" name="estado"><br>
                           <datalist id="estado">
                         <option value="AC">
                                    <option value="AL">
                                    <option value="AP">
                                    <option value="AM">
                                    <option value="BA">
                                    <option value="CE">
                                    <option value="DF">
                                    <option value="ES">
                                    <option value="GO">
                                    <option value="MA">
                                    <option value="MT">
                                    <option value="MS">
                                    <option value="MG">
                                    <option value="PA">
                                    <option value="PB">
                                    <option value="PR">
                                    <option value="PE">
                                    <option value="PI">
                                    <option value="RJ">
                                    <option value="RN">
                                    <option value="RS">
                                    <option value="RO">
                                    <option value="RR">
                                    <option value="SC">
                                    <option value="SP">
                                    <option value="SE">
                                    <option value="TO">
                                </datalist>

                <input type="text" name="cep"
                placeholder="CEP:">
                
        </div>
        </div>
        </div>

        <div class="rodape-form">
                <label class="termos">
                    <input type="checkbox"  required>
                    Li e aceito os <b>Termos de uso dos dados</b>, e as <b>politicas de Privacidade
                </b>
                    </label>

                <button type="submit" class="btn-cadastrar" id="cadastrar">Cadastrar</button>
            </div>

        </form>

        <div class="conteudo-conta">
<h2>Já tem conta ?</h2>

<h3><a href="boasvindas.html"class="ok"> Faça login por aqui</a></h3>
        </div>
  

        <script src="cadastro.js"></script>

</body>
</html>

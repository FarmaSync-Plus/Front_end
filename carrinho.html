<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras - FarmaSync</title>
    <link rel="stylesheet" href="css/carrinho.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="img/logo.png">
</head>
<body>

    <!-- Overlay e Cartão Informativo (Modal) -->
    <div id="sobreposicao-tela" style="display: none;">
        <div id="cartao-informativo">
            <div id="result"></div>
        </div>
    </div>

    <!-- Cabeçalho / Menu -->
    <div class="bloco">
        <header>
            <div class="logo">
                <img src="img/logo.png" alt="Logo da loja">
            </div>
        </header>

        <nav class="menu">
            <div class="menu-todos" onclick="toggleDropdown(event)">
                <i class="fa-solid fa-list-ul"></i> 
                <span>Todas as Categorias</span>
                <i class="fa-solid fa-chevron-down icone-seta"></i>

                <ul class="dropdown-menu" id="dropdownMenu">
                    <li><a href="#"><i class="fa-solid fa-pills"></i> Medicamentos</a></li>
                    <li><a href="#"><i class="fa-solid fa-soap"></i> Higiene</a></li>
                    <li><a href="#"><i class="fa-solid fa-heart"></i> Cuidados Pessoais</a></li>
                    <li><a href="#"><i class="fa-solid fa-baby"></i> Infantil</a></li>
                    <li><a href="#"><i class="fa-solid fa-tags"></i> Ofertas</a></li>
                    <li><a href="#"><i class="fa-solid fa-circle-info"></i> Sobre nós</a></li>
                </ul>
            </div>

            <div class="links-navegacao">
                <a href="index.html">Página Inicial</a>
                <a href="produtos.html">Produtos</a>
                <a href="sobrenos.html">Sobre Nós</a>
                <a href="contato.html">Contato</a>
            </div>
        </nav>
    </div>

    <!-- Conteúdo Principal do Carrinho -->
    <main class="carrinho-container">
        <h2>Carrinho de compras</h2>

        <div class="carrinho-layout">
            <!-- Lista de Produtos Dinâmica -->
            <div class="bloco-produtos">
                <!-- Inserido dinamicamente via JS -->
            </div>

            <!-- Resumo da Compra (Sidebar) -->
            <div class="bloco-resumo-wrapper">
                <div class="bloco-resumo">
                    <h3>Resumo da compra</h3>
                    
                    <div class="linha-resumo" id="precoProduto">
                        <span>Subtotal (1)</span>
                        <span>R$ 0,00</span>
                    </div>

                    <div class="linha-resumo total" id="precoTotal">
                        <span>Total</span>
                        <span>R$ 0,00</span>
                    </div>

                    <a href="formularioDeCompra.html">
                        <button type="button" class="btn-finalizar">Finalizar Compra</button>
                    </a>
                    
                    <a href="produtos.html" class="link-continuar">Continuar comprando</a>
                </div>
            </div>
        </div>
        <div class="produtos-semelhantes-container">
            <!-- Espaço reservado para carrossel/produtos semelhantes se necessário -->
        </div>
    </main>

    <script src="carrinho.js"></script>
</body>
</html>

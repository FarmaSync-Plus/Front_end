<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Compra - FarmaSync</title>
     <link rel="icon" href="img/logo.png">
    <script src="preferencias-globais.js" defer></script>
    <!-- Ícones e Estilos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           RESET & CONFIGURAÇÕES GLOBAIS
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
            background-color: #f4f6f8;
            color: #1f2d2b;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ==========================================================================
           CABEÇALHO
           ========================================================================== */
        .header-topo {
            width: 100%;
            background: #ffffff;
            padding-bottom: 15px;
            box-shadow: 0 2px 12px rgba(0, 60, 55, 0.08);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .logo-area {
            padding: 15px 40px;
            max-width: 1240px;
            margin: 0 auto;
        }

        .Logotipo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: white;
            padding: 4px;
            object-fit: contain;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            transition: transform 0.2s ease;
        }

        .Logotipo:hover {
            transform: scale(1.05);
        }

        .barra-roxa {
            background: #006C63;
            width: 92%;
            max-width: 1200px;
            margin: 0 auto;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            box-shadow: 0 6px 18px rgba(0, 108, 99, 0.2);
        }

        .Pesquisa {
            background: white;
            width: 380px;
            height: 40px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            padding: 0 6px 0 20px;
            justify-content: space-between;
            transition: background-color 0.3s ease;
        }

        .Pesquisa input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 14px;
            background: transparent;
            color: #1f2d2b;
        }

        .btn-pesquisa {
            background: #006C63;
            border: none;
            min-width: 32px;
            height: 32px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .btn-pesquisa:hover {
            background: #00564f;
        }

        .carrinho-area {
            color: #ffffff;
            font-size: 22px;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .carrinho-area:hover {
            transform: scale(1.1);
        }

        /* ==========================================================================
           ESTRUTURA PRINCIPAL E FORMULÁRIO
           ========================================================================== */
        .TITULO {
            text-align: center;
            color: #0f172a;
            background-color: #fff;
            margin: 35px auto 20px auto;
            padding: 14px 35px;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            font-size: 24px;
            font-weight: 700;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .produto {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px 50px 20px;
            box-sizing: border-box;
        }

        #carrinho {
            width: 100%;
            margin: 0 auto;
            padding: 35px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        #carrinho h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #1e293b;
            font-size: 22px;
        }

        #carrinho h3 {
            margin-top: 25px;
            margin-bottom: 12px;
            font-size: 16px;
            color: #1e293b;
            border-left: 4px solid #006C63;
            padding-left: 10px;
            font-weight: 700;
        }

        #carrinho label {
            display: block;
            margin-top: 16px;
            font-weight: 600;
            color: #475569;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        #carrinho input,
        #carrinho select,
        #carrinho textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            font-size: 15px;
            color: #1e293b;
            transition: all 0.2s ease;
            margin-top: 6px;
        }

        #carrinho input:focus,
        #carrinho select:focus,
        #carrinho textarea:focus {
            background: #fff;
            border-color: #006C63;
            box-shadow: 0 0 0 3px rgba(0, 108, 99, 0.12);
            outline: none;
        }

        #carrinho hr {
            border: none;
            height: 1px;
            background: #e2e8f0;
            margin: 25px 0;
            transition: background-color 0.3s ease;
        }

        #carrinho button[type="submit"] {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 10px;
            background: #006C63;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(0, 108, 99, 0.2);
        }

        #carrinho button[type="submit"]:hover {
            background: #00564f;
            transform: translateY(-2px);
        }

        #carrinho button[type="submit"]:active {
            transform: scale(0.98);
        }

        /* Bloco PIX & Elementos Dinâmicos */
        .bloco-pix {
            background-color: #f0fdf4;
            border: 2px dashed #22c55e;
            border-radius: 12px;
            padding: 24px;
            margin: 20px 0;
            text-align: center;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .qr-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 12px;
        }

        .bloco-pix .QRCODE {
            max-width: 150px;
            width: 100%;
            height: auto;
            padding: 8px;
            background: #ffffff;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
            display: block;
        }

        .pix-texto {
            font-size: 14px;
            color: #166534;
            margin: 0;
            line-height: 1.4;
        }

        /* Overlay e Modal */
        #sobreposicao-tela {
            display: none;
        }

        @keyframes entradaSuaveModal {
            0% { opacity: 0; transform: scale(0.85) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        #cartao-informativo {
            background: #fff;
            padding: 35px 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: entradaSuaveModal 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ==========================================================================
           SUPORTE AO TEMA ESCURO (DARK MODE)
           ========================================================================== */
        body.tema-escuro {
            background-color: #0f172a !important;
            color: #f8fafc !important;
        }

        body.tema-escuro .header-topo {
            background-color: #1e293b !important;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        body.tema-escuro .Pesquisa {
            background: #0f172a !important;
            border: 1px solid #334155;
        }

        body.tema-escuro .Pesquisa input {
            color: #f8fafc !important;
        }

        body.tema-escuro .TITULO {
            background-color: #1e293b !important;
            color: #f8fafc !important;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }

        body.tema-escuro #carrinho {
            background: #1e293b !important;
            border-color: #334155 !important;
            color: #f8fafc !important;
        }

        body.tema-escuro #carrinho h2,
        body.tema-escuro #carrinho h3 {
            color: #f8fafc !important;
        }

        body.tema-escuro #carrinho label {
            color: #94a3b8 !important;
        }

        body.tema-escuro #carrinho input,
        body.tema-escuro #carrinho select,
        body.tema-escuro #carrinho textarea {
            background: #0f172a !important;
            border-color: #334155 !important;
            color: #f8fafc !important;
        }

        body.tema-escuro #carrinho input:focus,
        body.tema-escuro #carrinho select:focus,
        body.tema-escuro #carrinho textarea:focus {
            background: #1e293b !important;
            border-color: #006C63 !important;
        }

        body.tema-escuro #carrinho hr {
            background: #334155 !important;
        }

        body.tema-escuro #totalPedido {
            color: #f8fafc !important;
        }

        body.tema-escuro .bloco-pix {
            background-color: #064e3b !important;
            border-color: #059669 !important;
        }

        body.tema-escuro .pix-texto {
            color: #a7f3d0 !important;
        }

        body.tema-escuro #cartao-informativo {
            background: #1e293b !important;
            color: #f8fafc !important;
        }
    </style>
</head>
<body>

    <!-- Overlay & Modal Informativo -->
    <div id="sobreposicao-tela">
        <div id="cartao-informativo">
            <div id="result"></div>
        </div>
    </div>

    <!-- Cabeçalho -->
    <header class="header-topo">
        <div class="logo-area">
            <a href="index.html">
                <img src="img/logo.png" alt="Logo FarmaSync" class="Logotipo">
            </a>
        </div>

        <div class="barra-roxa">
            <form action="" method="get" class="Pesquisa">
                <input type="text" name="busca" placeholder="Buscar Produtos">
                <button type="submit" class="btn-pesquisa">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </form>

            <a href="carrinho.html" class="carrinho-area">
                <i class="fa-solid fa-cart-shopping"></i>
            </a>
        </div>
    </header>

    <h1 class="TITULO">Formulário de Compra</h1>
    
    <section class="produto">
        <div id="carrinho">
            <form action="" method="POST" id="form">
                
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nomeUsuario" required>

                <label for="peso">Peso:</label>
                <input type="text" id="peso" name="peso" required>

                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep" required> 

                <label for="uf">UF:</label>
                <input list="lista-estado" name="estado" id="uf">
                <datalist id="lista-estado">
                    <option value="">Selecione o estado</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </datalist>

                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" required>
                
                <hr>
                
                <h3>Itens do Pedido:</h3>
                <div class="entrega" id="itensPedidos" style="display:flex; flex-direction:column; gap:8px;"></div>
                
                <div id="totalPedido" style="margin-top: 15px; font-weight: 700; font-size: 16px; text-align: right; color: #0f172a;"></div>

                <hr>

                <h3>Informações de Pagamento</h3>

                <label for="pagamento">Método de Pagamento:</label>
                <select id="pagamento" name="pagamento" required onchange="mostrarCampos()">
                    <option value="">Selecione</option>
                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                    <option value="Boleto Bancário">Boleto Bancário</option>
                    <option value="PIX">PIX</option>
                </select>

                <div id="detalhes-cartao" class="metodo-pagamento" style="display: none; margin-top: 15px;">
                    <label for="numero-cartao">Número do Cartão:</label>
                    <input type="text" id="numero-cartao" name="numero_cartao">

                    <label for="validade-cartao">Validade:</label>
                    <input type="text" id="validade-cartao" name="validade_cartao" placeholder="MM/AA">

                    <label for="cvv-cartao">CVV:</label>
                    <input type="text" id="cvv-cartao" name="cvv_cartao">

                    <label for="password">Senha:</label>
                    <input type="password" id="password" name="password" placeholder="Digite sua senha">
                </div>

                <div id="detalhes-do-boleto" class="metodo-pagamento" style="display:none; margin-top: 15px; padding: 15px; background: inherit; border-radius: 8px; border: 1px solid #e2e8f0;">
                    <p style="font-size: 14px; color: inherit; line-height: 1.5;"><strong>Após finalizar a compra, um boleto será gerado e enviado para o seu e-mail cadastrado.</strong></p>
                </div>

                <div id="detalhes-pix" class="bloco-pix" style="display:none;">
                    <div class="qr-container">
                        <img class="QRCODE" src="img/codigo_qr.png" alt="Código QR PIX">
                    </div>
                    <p class="pix-texto"><strong>Escaneie o QR Code acima para realizar o pagamento via PIX.</strong></p>
                </div>

                <button type="submit">Concluir Compra</button>
            </form>
        </div>
    </section>

    <!-- Scripts -->
    <script>
        function mostrarCampos() {
            let metodo = document.getElementById("pagamento").value;
            let cartao = document.getElementById("detalhes-cartao");
            let boleto = document.getElementById("detalhes-do-boleto");
            let pix = document.getElementById("detalhes-pix");

            cartao.style.display = "none";
            boleto.style.display = "none";
            pix.style.display = "none";

            if (metodo === "Cartão de Crédito") cartao.style.display = "block";
            else if (metodo === "Boleto Bancário") boleto.style.display = "block";
            else if (metodo === "PIX") pix.style.display = "block";
        }

        let usuarioIdGlobal = null;

        document.addEventListener('DOMContentLoaded', function () {
            const dados = localStorage.getItem('emailUsuario') || localStorage.getItem('cpf');

            fetch('http://localhost:8082/usuarios/')
                .then(r => r.json())
                .then(data => {
                    const usuarioLogado = data.find(u => u.emailUsuario === dados || u.cpf === dados);
                    if (usuarioLogado) {
                        usuarioIdGlobal = usuarioLogado.usuarioId;
                        localStorage.setItem('usuarioId', usuarioIdGlobal);
                        document.getElementById("nome").value = usuarioLogado.nomeUsuario;
                        document.getElementById("cep").value = usuarioLogado.cep;
                        document.getElementById("uf").value = usuarioLogado.estado;
                        document.getElementById("cidade").value = usuarioLogado.cidade;
                    } else {
                        const result = document.getElementById("result");
                        const modal = document.getElementById("cartao-informativo");
                        const caixa = document.getElementById("sobreposicao-tela");
                        
                        result.innerHTML = `<h3>Atenção</h3><br><p style="color:inherit; font-size:14px; margin-bottom:15px;">Usuário não encontrado. Por favor, crie uma conta ou faça login.</p><br><button id="tentativa" onclick="window.location.href='cadastro.html'" style="background:#006C63; color:white; border:none; padding:10px 24px; border-radius:8px; font-weight:600; cursor:pointer;">Cadastrar</button>`;
                        
                        caixa.style.position = "fixed";
                        caixa.style.top = "0";
                        caixa.style.left = "0";
                        caixa.style.width = "100%";
                        caixa.style.height = "100%";
                        caixa.style.background = "rgba(15, 23, 42, 0.6)";
                        caixa.style.display = "flex";
                        caixa.style.justifyContent = "center";
                        caixa.style.alignItems = "center";
                        caixa.style.zIndex = "9999";
                        caixa.style.backdropFilter = "blur(4px)";
                    }
                });

            const carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
            const divItens = document.getElementById("itensPedidos");
            let totalGeral = 0;
            if (divItens) {
                divItens.innerHTML = carrinho.map(item => {
                    totalGeral += item.preco * item.Quantidade;
                    return `<div style="display:flex; justify-content:space-between; align-items:center; background:inherit; border:1px solid #e2e8f0; border-radius:8px; padding:10px 14px; margin-bottom:6px;">
                        <span style="font-size:14px; color:inherit;">${item.nome} (Qtd: ${item.Quantidade})</span>
                        <span style="font-weight:700; color:#006C63; background:#e6f4f1; padding:4px 10px; border-radius:20px; font-size:13px;">
                            R$ ${Number(item.preco).toFixed(2)}
                        </span>
                    </div>`;
                }).join('');
                document.getElementById('totalPedido').innerHTML = `Total Geral: R$ ${totalGeral.toFixed(2)}`;
            }
        });

        document.getElementById("form").addEventListener('submit', function (e) {
            e.preventDefault();
            const pagamento = document.getElementById("pagamento").value;
            if (pagamento === "") {
                alert("Por favor, selecione um método de pagamento!");
                return;
            }

            const carrinhoFinal = JSON.parse(localStorage.getItem('carrinho')) || [];
            const totalFinal = carrinhoFinal.reduce((acc, item) => acc + (item.preco * item.Quantidade), 0);
            const qtdTotal = carrinhoFinal.reduce((acc, item) => acc + item.Quantidade, 0);

            const dadosDoPedido = {
                produto_json: JSON.stringify(carrinhoFinal),
                pagamento: pagamento,
                valor_total: totalFinal,
                quantidade_total: qtdTotal
            };

            fetch('http://localhost:8082/pedidos/finalizar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dadosDoPedido)
            })
            .then(res => {
                if (!res.ok) throw new Error("Status " + res.status);
                return res.json();
            })
            .then(pedidoSalvo => {
                localStorage.removeItem('carrinho');
                const result = document.getElementById("result");
                const modal = document.getElementById("cartao-informativo");
                const caixa = document.getElementById("sobreposicao-tela");
                
                result.innerHTML = `<h3>Sucesso!</h3><br><p style="color:inherit; font-size:14px; margin-bottom:15px;">Compra efetuada com sucesso!</p><br><button id="tentativa" onclick="window.location.href='confirmacao.html?id=${pedidoSalvo.pedidos_id || pedidoSalvo.id || ''}'" style="background:#006C63; color:white; border:none; padding:10px 24px; border-radius:8px; font-weight:600; cursor:pointer;">Ver Status</button>`;
                
                caixa.style.position = "fixed";
                caixa.style.top = "0";
                caixa.style.left = "0";
                caixa.style.width = "100%";
                caixa.style.height = "100%";
                caixa.style.background = "rgba(15, 23, 42, 0.6)";
                caixa.style.display = "flex";
                caixa.style.justifyContent = "center";
                caixa.style.alignItems = "center";
                caixa.style.zIndex = "9999";
                caixa.style.backdropFilter = "blur(4px)";
            })
            .catch(err => {
                console.error(err);
                const result = document.getElementById("result");
                const modal = document.getElementById("cartao-informativo");
                const caixa = document.getElementById("sobreposicao-tela");
                
                result.innerHTML = `<h3>Erro</h3><br><p style="color:inherit; font-size:14px; margin-bottom:15px;">Erro ao finalizar: ${err.message}. Verifique se o back-end está rodando.</p><br><button id="tentativa" onclick="window.location.href='formularioDeCompra.html'" style="background:#006C63; color:white; border:none; padding:10px 24px; border-radius:8px; font-weight:600; cursor:pointer;">Tentar Novamente</button>`;
                
                caixa.style.position = "fixed";
                caixa.style.top = "0";
                caixa.style.left = "0";
                caixa.style.width = "100%";
                caixa.style.height = "100%";
                caixa.style.background = "rgba(15, 23, 42, 0.6)";
                caixa.style.display = "flex";
                caixa.style.justifyContent = "center";
                caixa.style.alignItems = "center";
                caixa.style.zIndex = "9999";
                caixa.style.backdropFilter = "blur(4px)";
            });
        });
    </script>
</body>
</html>

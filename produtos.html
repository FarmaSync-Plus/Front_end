        function normalizar(texto) {
            return String(texto == null ? '' : texto).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }

        let produtosAtuais = [...produtosDoBanco];

        // Inicialização da Página e Filtro por URL com Prioridade Estrita
        document.addEventListener("DOMContentLoaded", function() {
            atualizarContadorCarrinho();

            const campoBusca = document.getElementById('campo-busca');
            const botaoLupa = document.querySelector('.botao-busca');
            
            if (campoBusca && window.FarmaBusca) {
                FarmaBusca.iniciar({ 
                    campo: campoBusca, 
                    lupa: botaoLupa,
                    aoEscolher: function(produto) {
                        window.location.href = 'produtos.html?busca=' + encodeURIComponent(produto.nome);
                    },
                    aoPesquisar: function(termo) {
                        window.location.href = 'produtos.html?busca=' + encodeURIComponent(termo);
                    }
                });
            }

            const urlParams = new URLSearchParams(window.location.search);
            const termoBusca = urlParams.get('busca');

            if (termoBusca) {
                if (campoBusca) campoBusca.value = termoBusca;
                const termoNorm = normalizar(termoBusca);
                
                let filtrados = produtosDoBanco.filter(p => normalizar(p.nome).includes(termoNorm));

                // ORDENAÇÃO DE PRIORIDADE ABSOLUTA: O produto pesquisado vem em 1º lugar
                filtrados.sort((a, b) => {
                    const nomeA = normalizar(a.nome);
                    const nomeB = normalizar(b.nome);

                    const exatoA = nomeA === termoNorm ? 0 : 1;
                    const exatoB = nomeB === termoNorm ? 0 : 1;
                    if (exatoA !== exatoB) return exatoA - exatoB;

                    const começaA = nomeA.startsWith(termoNorm) ? 0 : 1;
                    const começaB = nomeB.startsWith(termoNorm) ? 0 : 1;
                    if (começaA !== começaB) return começaA - começaB;

                    return nomeA.localeCompare(nomeB);
                });

                produtosAtuais = filtrados;
                renderizarCatalogo(produtosAtuais, termoBusca);
            } else {
                produtosAtuais = [...produtosDoBanco];
                renderizarCatalogo(produtosAtuais);
            }
        });

        // Função de Filtro por Categoria dos Botões
        function filtrarCategoria(categoria, elementoBotao) {
            document.querySelectorAll('.btn-filtro').forEach(btn => {
                btn.style.background = '#fff';
                btn.style.color = '#334155';
            });
            elementoBotao.style.background = '#0f766e';
            elementoBotao.style.color = '#fff';

            if (categoria === 'todos') {
                produtosAtuais = [...produtosDoBanco];
            } else {
                produtosAtuais = produtosDoBanco.filter(p => p.categoria === categoria);
            }

            renderizarCatalogo(produtosAtuais);
        }

        // Renderização em blocos de 4 para manter o grid original do CSS (.container-produtos)
        function renderizarCatalogo(produtos, termoPesquisa = null) {
            const catalogoContainer = document.getElementById('catalogo-produtos');
            const tituloPagina = document.getElementById('titulo-pagina');
            if (!catalogoContainer) return;

            if (termoPesquisa && tituloPagina) {
                tituloPagina.textContent = `Resultados da busca para: "${termoPesquisa}"`;
            } else if (tituloPagina) {
                tituloPagina.textContent = "Produtos";
            }

            if (produtos.length === 0) {
                catalogoContainer.innerHTML = `
                    <div style="text-align: center; padding: 50px; width: 100%;">
                        <h3>Nenhum produto encontrado ${termoPesquisa ? 'para “' + termoPesquisa + '”' : ''}.</h3>
                        <p style="margin-top: 10px; color: #64748b;">Tente buscar por outro termo ou selecione outra categoria.</p>
                    </div>
                `;
                return;
            }

            catalogoContainer.innerHTML = '';

            const grupos = [];
            for (let i = 0; i < produtos.length; i += 4) {
                grupos.push(produtos.slice(i, i + 4));
            }

            grupos.forEach(grupo => {
                const containerProdutos = document.createElement('div');
                containerProdutos.className = 'container-produtos';

                grupo.forEach(linha => {
                    const precoFormatado = Number(linha.preco).toLocaleString('pt-BR', {
                        style: 'currency',
                        currency: 'BRL'
                    });

                    const nomeImagem = linha.imagem ? linha.imagem.trim() : 'default.png';

                    const produtoDiv = document.createElement('div');
                    produtoDiv.className = 'produto';

                    produtoDiv.innerHTML = `
                        <a href="#"><img src="produtos/${nomeImagem}" alt="${linha.nome}" onerror="this.src='img/logo.png'"></a>
                        <h3 class="produto-title">${linha.nome}</h3>
                        <p><strong>${precoFormatado}</strong></p>
                        <button class="btn" onclick="adicionarAoCarrinho(${linha.id_produto})">Adicionar ao carrinho</button>
                    `;

                    containerProdutos.appendChild(produtoDiv);
                });

                catalogoContainer.appendChild(containerProdutos);
            });
        }

        function adicionarAoCarrinho(idProduto) {
            const produto = produtosDoBanco.find(p => p.id_produto === idProduto);
            if (!produto) return;

            let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
            const itemExistente = carrinho.find(item => item.id_produto === idProduto);

            if (itemExistente) {
                itemExistente.Quantidade += 1;
            } else {
                carrinho.push({
                    id_produto: produto.id_produto,
                    nome: produto.nome,
                    preco: produto.preco,
                    imagem: produto.imagem,
                    Quantidade: 1
                });
            }
            
            localStorage.setItem('carrinho', JSON.stringify(carrinho));
            atualizarContadorCarrinho();

            resposta.innerHTML = `
                <h3>${produto.nome}</h3>
                <p>Adicionado com sucesso ao carrinho!</p>
                <button id="tentativa" onclick="fecharMensagem()">Continuar Comprando</button>
            `;

            sobreposicaotela.style.display = "flex";
            sobreposicaotela.style.position = "fixed";
            sobreposicaotela.style.top = "0";
            sobreposicaotela.style.left = "0";
            sobreposicaotela.style.width = "100%";
            sobreposicaotela.style.height = "100%";
            sobreposicaotela.style.background = "rgba(15, 23, 42, 0.6)";
            sobreposicaotela.style.justifyContent = "center";
            sobreposicaotela.style.alignItems = "center";
            sobreposicaotela.style.zIndex = "9999";
            sobreposicaotela.style.backdropFilter = "blur(4px)";
        }

        function fecharMensagem() {
            sobreposicaotela.style.display = 'none';
        }
    </script>
